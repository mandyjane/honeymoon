          <button onClick={onClose} style={{background:th.inp,border:"none",borderRadius:8,width:32,height:32,fontSize:16,color:th.text,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{marginBottom:10}}><div style={{fontSize:11,color:th.mut,marginBottom:3,textTransform:"uppercase"}}>Emoji</div><input value={f.emoji} onChange={e=>u("emoji",e.target.value)} style={{width:60,padding:"8px",borderRadius:8,border:`1px solid ${th.bdr}`,background:th.inp,color:th.text,fontSize:20,textAlign:"center",boxSizing:"border-box",outline:"none"}}/></div>
        {inp("Title","title")}
        <div style={{marginBottom:10}}><div style={{fontSize:11,color:th.mut,marginBottom:3,textTransform:"uppercase"}}>Description</div><textarea value={f.desc||""} onChange={e=>u("desc",e.target.value)} rows={3} style={{width:"100%",padding:"8px 10px",borderRadius:8,border:`1px solid ${th.bdr}`,background:th.inp,color:th.text,fontSize:13,boxSizing:"border-box",outline:"none",resize:"vertical",fontFamily:"inherit"}}/></div>
        {inp("Duration","dur")}{inp("Distance","dist")}{inp("Transport","how")}{inp("Price","price")}
        <div style={{marginBottom:16}}><div style={{fontSize:11,color:th.mut,marginBottom:3,textTransform:"uppercase"}}>Move to Day</div>
          <select value={td} onChange={e=>sTd(e.target.value)} style={{width:"100%",padding:"8px 10px",borderRadius:8,border:`1px solid ${th.bdr}`,background:th.inp,color:th.text,fontSize:13,boxSizing:"border-box",outline:"none"}}>
            {days.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
          </select>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>{if(td!==curDay)onMove(f,td);else onSave(f);onClose();}} style={{flex:1,padding:12,borderRadius:12,border:"none",background:th.acc,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>Save</button>
          <button onClick={onClose} style={{padding:"12px 20px",borderRadius:12,border:`1px solid ${th.bdr}`,background:"transparent",color:th.text,fontSize:14,cursor:"pointer"}}>Cancel</button>
        </div>
      </div>
    </div>
  );
};

/* ── ADD MODAL ── */
const AddM=({th,standby,onNew,onRestore,onClose})=>(
  <div style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div style={{background:th.card,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:480,maxHeight:"70vh",overflow:"auto",padding:"20px 20px env(safe-area-inset-bottom,20px)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{fontSize:16,fontWeight:700,color:th.text}}>Add Activity</span>
        <button onClick={onClose} style={{background:th.inp,border:"none",borderRadius:8,width:32,height:32,fontSize:16,color:th.text,cursor:"pointer"}}>✕</button>
      </div>
      <button onClick={()=>{onNew();onClose();}} style={{width:"100%",padding:14,borderRadius:12,border:`2px dashed ${th.acc}`,background:"transparent",color:th.acc,fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:16}}>+ Create New Activity</button>
      {standby.length>0&&<>
        <div style={{fontSize:12,fontWeight:600,color:th.mut,textTransform:"uppercase",marginBottom:8}}>Restore from Standby ({standby.length})</div>
        {standby.map(a=>(
          <button key={a.id} onClick={()=>{onRestore(a.id);onClose();}} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:th.tag,border:`1px solid ${th.bdr}`,borderRadius:12,marginBottom:6,cursor:"pointer",textAlign:"left"}}>
            <span style={{fontSize:20}}>{a.emoji}</span>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:th.text}}>{a.title}</div><div style={{fontSize:11,color:th.mut}}>{a.dur} · {a.price}</div></div>
            <span style={{color:th.acc,fontSize:13,fontWeight:600}}>+</span>
          </button>
        ))}
      </>}
    </div>
  </div>
);

/* ── MAIN ── */
function App(){
  const[tab,setTab]=useState("overview");
  const[dark,setDark]=useState(false);
  const[edit,setEdit]=useState(false);
  const[data,setData]=useState(INIT);
  const[standby,setStandby]=useState([]);
  const[ea,sEa]=useState(null);const[ed,sEd]=useState(null);const[eDst,sEDst]=useState(null);
  const[aDay,sADay]=useState(null);const[aDst,sADst]=useState(null);
  const[loaded,setLoaded]=useState(false);
  const th=dark?themes.dark:themes.light;

  useEffect(()=>{const s=load();if(s){if(s.data)setData(s.data);if(s.standby)setStandby(s.standby);if(s.dark!==undefined)setDark(s.dark)}setLoaded(true)},[]);
  useEffect(()=>{if(loaded)save({data,standby,dark})},[data,standby,dark,loaded]);
  useEffect(()=>{document.body.className=dark?"dark":""},[dark]);

  const allDays=["phiphi","samui","phuket"].flatMap(d=>(data[d]||[]).map(x=>({...x,dest:d})));
  const rmAct=(dest,dayId,actId)=>{const day=data[dest].find(d=>d.id===dayId);const act=day?.acts.find(a=>a.id===actId);if(!act)return;setStandby(s=>[...s,{...act,fromDest:dest,fromDay:dayId}]);setData(p=>({...p,[dest]:p[dest].map(d=>d.id===dayId?{...d,acts:d.acts.filter(a=>a.id!==actId)}:d)}))};
  const saveAct=(dest,dayId,upd)=>{setData(p=>({...p,[dest]:p[dest].map(d=>d.id===dayId?{...d,acts:d.acts.map(a=>a.id===upd.id?upd:a)}:d)}))};
  const moveAct=(dest,fromDay,act,toDay)=>{const tDest=allDays.find(d=>d.id===toDay)?.dest||dest;setData(p=>{const n={...p};n[dest]=n[dest].map(d=>d.id===fromDay?{...d,acts:d.acts.filter(a=>a.id!==act.id)}:d);n[tDest]=n[tDest].map(d=>d.id===toDay?{...d,acts:[...d.acts,act]}:d);return n})};
  const addNew=(dest,dayId)=>{const id=`n${Date.now()}`;const act=mk(id,"🎯","New Activity","","","","","");setData(p=>({...p,[dest]:p[dest].map(d=>d.id===dayId?{...d,acts:[...d.acts,act]}:d)}));sEa(act);sEd(dayId);sEDst(dest)};
  const restore=(dest,dayId,actId)=>{const act=standby.find(a=>a.id===actId);if(!act)return;setStandby(s=>s.filter(a=>a.id!==actId));const{fromDest,fromDay,...clean}=act;setData(p=>({...p,[dest]:p[dest].map(d=>d.id===dayId?{...d,acts:[...d.acts,clean]}:d)}))};

  const renderDays=(dest)=>data[dest]?.map(day=>(
    <div key={day.id}>
      <Sec th={th}>{day.label}</Sec>
      {day.note&&<Note th={th}>{day.note}</Note>}
      {day.acts.map(a=><ActC key={a.id} th={th} act={a} edit={edit} onEdit={a=>{sEa(a);sEd(day.id);sEDst(dest)}} onRm={id=>rmAct(dest,day.id,id)}/>)}
      {edit&&<button onClick={()=>{sADay(day.id);sADst(dest)}} style={{width:"100%",padding:12,borderRadius:12,border:`2px dashed ${th.acc}`,background:"transparent",color:th.acc,fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:12}}>+ Add Activity</button>}
    </div>
  ));

  return(
    <div style={{background:th.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto",transition:"background .3s"}}>
      <div style={{padding:"16px 16px 100px"}}>

        {tab==="overview"&&<>
          <div style={{background:th.hero,borderRadius:20,padding:"28px 22px",color:"#fff",marginBottom:20,position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:-20,right:-20,fontSize:80,opacity:.1}}>🌺</div>
            <div style={{fontSize:12,textTransform:"uppercase",letterSpacing:2,opacity:.7,marginBottom:6}}>February 2027</div>
            <div style={{fontSize:26,fontWeight:800,lineHeight:1.2,marginBottom:4}}>Thailand<br/>Honeymoon</div>
            <div style={{fontSize:13,opacity:.8}}>14 nights · 3 destinations · 2 travellers</div>
            <div style={{display:"flex",gap:6,marginTop:14,flexWrap:"wrap"}}>
              {["Phi Phi Islands","Koh Samui","Phuket"].map((d,i)=><span key={i} style={{fontSize:11,background:"rgba(255,255,255,.2)",padding:"4px 10px",borderRadius:20}}>{d}</span>)}
            </div>
          </div>
          <Sec th={th}>Trip Timeline</Sec>
          {[{d:"Thu 11 – Fri 12 Feb",l:"Travel Day",s:"BNE → SIN → Phuket → Phi Phi",i:"✈️",t:1},{d:"Fri 12 – Mon 15 Feb",l:"Koh Phi Phi",s:"3 nights · CoCo Beach Resort",i:"🏝️"},{d:"Mon 15 Feb",l:"Travel Day",s:"Phi Phi → Krabi → Koh Samui",i:"🚤",t:1},{d:"Mon 15 – Sat 21 Feb",l:"Koh Samui",s:"6 nights · SALA Samui",i:"🌴"},{d:"Sat 21 Feb",l:"Travel Day",s:"Koh Samui → Phuket",i:"✈️",t:1},{d:"Sat 21 – Wed 25 Feb",l:"Phuket",s:"4 nights · Impiana Patong",i:"⛱️"},{d:"Thu 25 – Fri 26 Feb",l:"Travel Home",s:"Phuket → SIN → Brisbane",i:"🏠",t:1}].map((x,i)=>(
            <div key={i} style={{display:"flex",gap:12,marginBottom:2}}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:28,flexShrink:0}}>
                <div style={{width:28,height:28,borderRadius:"50%",background:x.t?th.tag:`linear-gradient(135deg,${th.coral},${th.sandDk})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>{x.i}</div>
                {i<6&&<div style={{width:2,flex:1,background:th.bdr,minHeight:20}}/>}
              </div>
              <div style={{paddingBottom:16}}><div style={{fontSize:11,color:th.mut}}>{x.d}</div><div style={{fontWeight:700,fontSize:14,color:th.text}}>{x.l}</div><div style={{fontSize:12,color:th.sub}}>{x.s}</div></div>
            </div>
          ))}
          <Sec th={th}>Budget</Sec>
          <div style={{background:th.card,borderRadius:14,overflow:"hidden",boxShadow:th.sh}}>
            {[["Flights & Ferries","A$3,753"],["Accommodation","A$7,457"],["Transfers","A$190"]].map(([l,v],i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"12px 16px",borderBottom:`1px solid ${th.bdr}`}}>
                <span style={{fontSize:13,color:th.sub}}>{l}</span><span style={{fontSize:13,fontWeight:700,color:th.text}}>{v}</span>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",padding:"14px 16px",background:th.accBg,color:"#fff"}}>
              <span style={{fontSize:14,fontWeight:600}}>Estimated Total</span><span style={{fontSize:16,fontWeight:800}}>~A$11,400</span>
            </div>
          </div>
          <Sec th={th}>Booking References</Sec>
          <div style={{background:th.card,borderRadius:14,padding:16,boxShadow:th.sh}}>
            {[["BNE ↔ HKT","Singapore Airlines","DIE356"],["KBV → USM","Bangkok Airways","D5VC6X"],["USM → HKT","Bangkok Airways","D64QO5"]].map(([r,c,ref],i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<2?`1px solid ${th.bdr}`:"none"}}>
                <div><div style={{fontSize:13,fontWeight:600,color:th.text}}>{r}</div><div style={{fontSize:11,color:th.mut}}>{c}</div></div>
                <code style={{fontSize:13,fontWeight:700,color:th.acc,background:th.tag,padding:"3px 8px",borderRadius:6}}>{ref}</code>
              </div>
            ))}
          </div>
        </>}

        {tab==="phiphi"&&<>
          <div style={{fontSize:22,fontWeight:800,color:th.text}}>Koh Phi Phi 🏝️</div>
          <div style={{fontSize:13,color:th.mut,marginBottom:16}}>Fri 12 – Mon 15 Feb · 3 nights</div>
          <Sec th={th}>Getting There</Sec>
          <FG><Flight th={th} from="BNE" to="SIN" date="Thu 11 Feb" dep="23:25" arr="05:05" flight="SQ-246" carrier="Singapore Airlines" bref="DIE356" notes="A350-900 · 25kg" pdfKeys={["amanda_sq","liam_sq"]}/><LBar th={th} airport="Singapore (Changi)" dur="1h 20min"/><Flight th={th} from="SIN" to="HKT" date="Fri 12 Feb" dep="06:25" arr="07:50" flight="SQ-724" carrier="Singapore Airlines" notes="737-8 MAX"/></FG>
          <Xfer th={th} icon="🚕" from="Phuket Airport" to="Rassada Pier" time="40–60 min" method="Grab / Bolt" cost="A$40"/>
          <Note th={th}>⏳ 1.5 hr wait at Rassada Pier</Note>
          <Ferry th={th} type="Ferry" from="Rassada Pier" to="Phi Phi Tonsai" dep="13:30" arr="15:30" dur="2 hours" date="Fri 12 Feb" cost="A$102 (both)"/>
          <Sec th={th}>Your Stay</Sec>
          <Acc th={th} name="Phi Phi CoCo Beach Resort" room="Pool Beach Bungalow" dates={["Fri 12 Feb","Mon 15 Feb"]} nights="3" bfast="Included" ppn="538.67" total="1,616" feat={["🏖️ Beach","🏊 Pool","🛶 Kayaks","💆 Massage","📶 WiFi","🎬 Movies"]}/>
          {renderDays("phiphi")}
          <Sec th={th}>Departure — Mon 15 Feb</Sec>
          <Note th={th}>Check-out 11:00. Tonsai Pier for 10:30 speedboat.</Note>
          <Ferry th={th} type="Speedboat" from="Phi Phi" to="Krabi Pier" dep="10:30" arr="11:30" dur="1 hour" date="Mon 15 Feb" cost="A$102 (both)"/>
          <Xfer th={th} icon="🚕" from="Krabi Pier" to="KBV Airport" time="30 min" method="Grab / Bolt" cost="A$30"/>
          <Note th={th}>⏳ 1h 15min at Krabi Airport</Note>
          <FG><Flight th={th} from="KBV" to="USM" date="Mon 15 Feb" dep="13:45" arr="14:30" flight="PG-266" carrier="Bangkok Airways" bref="D5VC6X" notes="45 min · 20kg" pdfKeys={["amanda_15","liam_15"]}/></FG>
          <Xfer th={th} icon="🚕" from="Samui Airport" to="SALA Samui" time="10 min" method="Grab / Bolt" cost="A$10"/>
        </>}

        {tab==="samui"&&<>
          <div style={{fontSize:22,fontWeight:800,color:th.text}}>Koh Samui 🌴</div>
          <div style={{fontSize:13,color:th.mut,marginBottom:16}}>Mon 15 – Sat 21 Feb · 6 nights</div>
          <Sec th={th}>Your Stay</Sec>
          <Acc th={th} name="SALA Samui Chaweng Beach" room="Oceanfront Balcony Pool Suite" dates={["Mon 15 Feb","Sat 21 Feb"]} nights="6" bfast="Not included" ppn="732.70" total="4,396" feat={["🏖️ Beach","🏊 Private pool","🛁 Bathtub","🌅 Ocean view","🧖 Spa","🍽️ The Tent"]}/>
          <Note th={th}>Oceanfront Wing — private pool, ocean-view balcony. The Tent right there. Sexy Fish & SALA Spa across the road.</Note>
          {renderDays("samui")}
          <Sec th={th}>Departure — Sat 21 Feb</Sec>
          <Note th={th}>Check-out 11:00. 10 min to airport.</Note>
          <Xfer th={th} icon="🚕" from="SALA Samui" to="Samui Airport" time="10 min" method="Grab / Bolt" cost="A$10"/>
          <FG><Flight th={th} from="USM" to="HKT" date="Sat 21 Feb" dep="12:30" arr="13:30" flight="PG-253" carrier="Bangkok Airways" bref="D64QO5" notes="1 hr · 20kg · Seats 07C/07D" pdfKeys={["amanda_21","liam_21"]}/></FG>
          <Xfer th={th} icon="🚕" from="Phuket Airport" to="Impiana Patong" time="1 hr" method="Grab / Bolt" cost="A$50"/>
        </>}

        {tab==="phuket"&&<>
          <div style={{fontSize:22,fontWeight:800,color:th.text}}>Phuket ⛱️</div>
          <div style={{fontSize:13,color:th.mut,marginBottom:16}}>Sat 21 – Wed 25 Feb · 4 nights</div>
          <Sec th={th}>Your Stay</Sec>
          <Acc th={th} name="Impiana Resort Patong" room="Superior Ocean View" dates={["Sat 21 Feb","Wed 25 Feb"]} nights="4" bfast="Included" ppn="361.25" total="1,445" feat={["🏖️ Beach","🏊 Pool","🧖 Spa","🍽️ Sala Bua","🍸 Bar","📍 Bangla Rd"]}/>
          <Note th={th}>Right on Patong Beach. 5 min to Bangla Road & Jungceylon.</Note>
          {renderDays("phuket")}
          <Sec th={th}>Going Home — Wed 25 Feb</Sec>
          <Xfer th={th} icon="🚕" from="Patong" to="Phuket Airport" time="1 hr" method="Grab / Bolt" cost="A$50"/>
          <FG><Flight th={th} from="HKT" to="SIN" date="Wed 25 Feb" dep="14:55" arr="18:00" flight="SQ-731" carrier="Singapore Airlines" bref="DIE356" notes="737-8 MAX · 25kg" pdfKeys={["amanda_sq","liam_sq"]}/><LBar th={th} airport="Singapore (Changi)" dur="3h 35min" tip="Shops & food in T3"/><Flight th={th} from="SIN" to="BNE" date="Wed 25→Thu 26 Feb" dep="21:35" arr="07:15+1" flight="SQ-235" carrier="Singapore Airlines" notes="A350-900 · Arrive BNE Fri 26 Feb 🎉"/></FG>
        </>}

        {tab==="settings"&&<>
          <div style={{fontSize:22,fontWeight:800,color:th.text}}>Settings ⚙️</div>
          <div style={{fontSize:13,color:th.mut,marginBottom:20}}>Customise your itinerary</div>
          {[["🌙","Dark Mode","Light and dark theme",dark,()=>setDark(!dark)],["✏️","Edit Mode","Modify, add, remove activities",edit,()=>setEdit(!edit)]].map(([ico,t,s,on,fn],i)=>(
            <div key={i} style={{background:th.card,borderRadius:16,padding:16,boxShadow:th.sh,marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontSize:14,fontWeight:600,color:th.text}}>{ico} {t}</div><div style={{fontSize:12,color:th.mut}}>{s}</div></div>
                <button onClick={fn} style={{width:52,height:30,borderRadius:15,border:"none",background:on?th.acc:th.bdr,position:"relative",cursor:"pointer",transition:"background .3s"}}>
                  <div style={{width:24,height:24,borderRadius:12,background:"#fff",position:"absolute",top:3,left:on?25:3,transition:"left .3s",boxShadow:"0 1px 3px rgba(0,0,0,.2)"}}/>
                </button>
              </div>
            </div>
          ))}
          {standby.length>0&&<><Sec th={th}>Standby List ({standby.length})</Sec><Note th={th}>Removed activities. Use + on any day to restore.</Note>
            {standby.map(a=>(
              <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:th.card,border:`1px solid ${th.bdr}`,borderRadius:12,marginBottom:8,boxShadow:th.sh}}>
                <span style={{fontSize:20}}>{a.emoji}</span>
                <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:th.text}}>{a.title}</div><div style={{fontSize:11,color:th.mut}}>{a.dur} · {a.price}</div></div>
                <button onClick={()=>setStandby(s=>s.filter(x=>x.id!==a.id))} style={{background:th.coral,color:"#fff",border:"none",borderRadius:6,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer"}}>Delete</button>
              </div>
            ))}
          </>}
          <Sec th={th}>Travel Documents</Sec>
          <Note th={th}>Connect Supabase to enable PDF downloads.</Note>
          {[{t:"Singapore Airlines · BNE ↔ HKT",r:"DIE356",k:["amanda_sq","liam_sq"]},{t:"Bangkok Airways · KBV → USM",r:"D5VC6X",k:["amanda_15","liam_15"]},{t:"Bangkok Airways · USM → HKT",r:"D64QO5",k:["amanda_21","liam_21"]}].map((g,i)=>(
            <div key={i} style={{marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:600,color:th.text,marginBottom:4}}>{g.t}</div>
              <div style={{fontSize:11,color:th.mut,marginBottom:6}}>Ref: {g.r}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {g.k.map(k=><button key={k} onClick={()=>dlPdf(k)} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 12px",background:th.card,border:`1px solid ${th.bdr}`,borderRadius:10,cursor:"pointer"}}><span style={{fontSize:14}}>📄</span><span style={{fontSize:12,fontWeight:600,color:th.text}}>{PDF_META[k].label}</span><span style={{fontSize:11,color:th.acc}}>⬇</span></button>)}
              </div>
            </div>
          ))}
          <Sec th={th}>Reset</Sec>
          <button onClick={()=>{if(confirm("Reset all activities to default?")){setData(INIT);setStandby([])}}} style={{width:"100%",padding:12,borderRadius:12,border:`1px solid ${th.coral}`,background:"transparent",color:th.coral,fontSize:13,fontWeight:600,cursor:"pointer"}}>Reset All to Default</button>
        </>}
      </div>

      {ea&&<EditM th={th} act={ea} days={allDays} curDay={ed} onSave={u=>saveAct(eDst,ed,u)} onMove={(a,td)=>moveAct(eDst,ed,a,td)} onClose={()=>sEa(null)}/>}
      {aDay&&<AddM th={th} standby={standby} onNew={()=>addNew(aDst,aDay)} onRestore={id=>restore(aDst,aDay,id)} onClose={()=>{sADay(null);sADst(null)}}/>}

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:th.tabBg,backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderTop:`1px solid ${th.tabBdr}`,display:"flex",justifyContent:"space-around",padding:"6px 0 env(safe-area-inset-bottom,8px)",zIndex:100}}>
        {TABS.map(t=>(
          <button key={t} onClick={()=>{setTab(t);window.scrollTo(0,0)}} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"6px 12px",color:tab===t?th.acc:th.mut}}>
            <span style={{fontSize:20}}>{TICO[t]}</span>
            <span style={{fontSize:10,fontWeight:tab===t?700:500}}>{TLAB[t]}</span>
            {tab===t&&<div style={{width:4,height:4,borderRadius:"50%",background:th.acc,marginTop:1}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
