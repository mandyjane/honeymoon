/* ── TICKET STORAGE (IndexedDB blobs) ── */
const TDB = "th-honeymoon-tickets";
const TSTORE = "tickets";
const MAX_TICKET_MB = 5;
let tdbPromise = null;
const openTDB = () => {
  if (tdbPromise) return tdbPromise;
  tdbPromise = new Promise((res, rej) => {
    const req = indexedDB.open(TDB, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(TSTORE)) db.createObjectStore(TSTORE, {
        keyPath: "id"
      });
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror = e => rej(e.target.error);
  });
  return tdbPromise;
};
const putTicket = async t => {
  const db = await openTDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(TSTORE, "readwrite");
    const r = tx.objectStore(TSTORE).put(t);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
};
const getTicket = async id => {
  const db = await openTDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(TSTORE, "readonly");
    const r = tx.objectStore(TSTORE).get(id);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
};
const delTicket = async id => {
  const db = await openTDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(TSTORE, "readwrite");
    const r = tx.objectStore(TSTORE).delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
};
const clearTickets = async () => {
  const db = await openTDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(TSTORE, "readwrite");
    const r = tx.objectStore(TSTORE).clear();
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
};

const calcDur = (dep, arr) => {
  try {
    const parse = t => {
      const nd = t.includes("+1");
      const c = t.replace(/\+1/, "").trim();
      const [h, m] = c.split(":").map(Number);
      return h * 60 + m + (nd ? 1440 : 0);
    };
    let diff = parse(arr) - parse(dep);
    if (diff < 0) diff += 1440;
    const hrs = Math.floor(diff / 60),
      mins = diff % 60;
    if (hrs === 0) return mins + " min";
    if (mins === 0) return hrs + (hrs > 1 ? " hours" : " hour");
    return hrs + "h " + mins + "min";
  } catch {
    return "";
  }
};

/* ── PRICE HELPERS ── */
const RATE = 22.5;
const thbToAud = s => {
  const parts = s.replace(/,/g, "").split(/[-–]/);
  if (parts.length === 2) {
    const lo = Math.round(parseFloat(parts[0]) / RATE),
      hi = Math.round(parseFloat(parts[1]) / RATE);
    if (isNaN(lo) || isNaN(hi)) return "";
    return "A$" + lo + "–" + hi;
  }
  const v = parseFloat(parts[0]);
  if (isNaN(v)) return "";
  return "A$" + Math.round(v / RATE);
};
const fmtPrice = (thb, aud, suffix) => {
  if (!thb && !aud) return "";
  if (!thb) return aud;
  const c = thb.replace(/,/g, "").trim(),
    p = c.split(/[-–]/);
  let d;
  if (p.length === 2) d = "฿" + parseInt(p[0]).toLocaleString() + "–" + parseInt(p[1]).toLocaleString();else d = "฿" + parseInt(p[0]).toLocaleString();
  const a = aud || thbToAud(c);
  return d + (suffix ? "/" + suffix : "") + " (" + (a || "?") + ")";
};
